<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <defs>
    <!-- Sfumatura cuore superiore sinistra (Orchidea #e27fdb -> Magenta #a32f96 -> Rosso #cd2727) -->
    <linearGradient id="grad-heart-left" x1="18%" y1="18%" x2="68%" y2="28%">
      <stop offset="0%" stop-color="#cd2727" />
      <stop offset="50%" stop-color="#a32f96" />
      <stop offset="100%" stop-color="#e27fdb" />
    </linearGradient>

    <!-- Sfumatura cuore superiore destra (Magenta #a32f96 -> Orchidea #e27fdb) -->
    <linearGradient id="grad-heart-right" x1="53%" y1="10%" x2="96%" y2="35%">
      <stop offset="0%" stop-color="#a32f96" />
      <stop offset="100%" stop-color="#e27fdb" />
    </linearGradient>
  </defs>

