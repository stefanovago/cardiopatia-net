    <path d="M 612,174 C 668,132 755,132 825,190 C 800,152 745,125 685,132 C 648,136 625,155 612,174 Z" fill="#801010" />
    <path d="M 512,960 C 310,960 112,735 58,505 C 18,335 55,165 175,92 C 260,40 375,45 478,108 C 545,148 625,222 698,300 L 668,300 C 585,212 495,135 405,115 C 275,85 162,158 122,295 C 85,420 118,582 215,715 C 305,838 418,900 512,900 C 606,900 719,838 809,715 C 906,582 939,420 902,295 C 868,180 780,128 685,142 C 655,146 630,158 612,174 C 665,125 755,115 835,165 C 945,232 995,375 955,535 C 898,755 714,960 512,960 Z" fill="#cd2727" />
    <path d="M 105,638 C 195,815 358,960 512,960 C 555,960 598,948 640,925 C 585,938 535,935 485,915 C 335,865 192,762 105,638 Z" fill="#801010" />
    <path d="M 885,685 C 815,805 685,915 545,955 C 695,942 825,815 885,685 Z" fill="#801010" />
  </g>

